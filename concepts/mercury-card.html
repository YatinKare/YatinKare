<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yatin — Mercury</title><style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const canvas=document.querySelector('#river');
try {
const renderer=new T.WebGLRenderer({canvas,alpha:true,antialias:true,premultipliedAlpha:false});
renderer.setPixelRatio(2);renderer.setClearColor(0,0);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new T.Scene(),camera=new T.OrthographicCamera(-2.7,2.7,1.5,-1.5,.1,20);camera.position.set(0,0,5);
const room=new RoomEnvironment(),pmrem=new T.PMREMGenerator(renderer),env=pmrem.fromScene(room,.02);scene.environment=env.texture;room.dispose();pmrem.dispose();
const material=new T.MeshPhysicalMaterial({color:0xe8ebee,metalness:1,roughness:.13,envMapIntensity:1.5,clearcoat:.15});
// Match the card's CSS bounds exactly in the orthographic camera's coordinates.
const halfWidth=2.7*.84,halfHeight=1.5*.76,corner=5.4*.03;
const path=new T.Path();
path.moveTo(-halfWidth+corner,halfHeight);
path.lineTo(halfWidth-corner,halfHeight);
path.absarc(halfWidth-corner,halfHeight-corner,corner,Math.PI/2,0,true);
path.lineTo(halfWidth,-halfHeight+corner);
path.absarc(halfWidth-corner,-halfHeight+corner,corner,0,-Math.PI/2,true);
path.lineTo(-halfWidth+corner,-halfHeight);
path.absarc(-halfWidth+corner,-halfHeight+corner,corner,-Math.PI/2,-Math.PI,true);
path.lineTo(-halfWidth,halfHeight-corner);
path.absarc(-halfWidth+corner,halfHeight-corner,corner,Math.PI,Math.PI/2,true);
path.arcLengthDivisions=1600;path.updateArcLengths();
const N=400,M=40,centers=[],tangents=[];
for(let i=0;i<=N;i++){centers.push(path.getPointAt(i/N));tangents.push(path.getTangentAt(i/N).normalize());}
// One watertight surface: faster currents are blended into its cross-section.
const positions=new Float32Array((N+1)*(M+1)*3),indices=[];
for(let i=0;i<N;i++)for(let j=0;j<M;j++){const a=i*(M+1)+j,b=a+M+1;indices.push(a,a+1,b,a+1,b+1,b);}
const geometry=new T.BufferGeometry();
geometry.setAttribute('position',new T.BufferAttribute(positions,3).setUsage(T.DynamicDrawUsage));
geometry.setIndex(indices);scene.add(new T.Mesh(geometry,material));
function periodicDistance(a,b){const d=Math.abs(a-b)%1;return Math.min(d,1-d);}
function pulse(u,center,width){const d=periodicDistance(u,center);return Math.exp(-d*d/(width*width));}
function section(u,t){
 const flow=t/16;
 // A substantial minimum depth keeps every part of the current full.
 let bulk=.061;
 for(let j=0;j<4;j++)bulk+=(.025+.008*Math.cos(j*2.1))*pulse(u,(flow+j/4)%1,.046);
 const fast=pulse(u,(flow*1.18+.23)%1,.085)+.8*pulse(u,(flow*1.18+.73)%1,.065);
 const faster=pulse(u,(flow*1.36+.46)%1,.075)+.7*pulse(u,(flow*1.36+.96)%1,.06);
 return {bulk,fast,faster,flow};
}
function frame(t){
 for(let i=0;i<=N;i++){
  const u=i/N,p=centers[i],v=tangents[i],f=section(u,t);
  // Local ridges weave across the same fluid body, then flatten back into it.
  const angleA=1.05+.45*Math.sin(2*Math.PI*(u-f.flow*1.18));
  const angleB=2.10+.40*Math.sin(2*Math.PI*(u-f.flow*1.36)+1.7);
  for(let j=0;j<=M;j++){
   const a=j/M*Math.PI*2,c=Math.cos(a),s=Math.sin(a),k=(i*(M+1)+j)*3;
   const da=Math.atan2(Math.sin(a-angleA),Math.cos(a-angleA));
   const db=Math.atan2(Math.sin(a-angleB),Math.cos(a-angleB));
   const ridgeA=.046*f.fast*Math.exp(-da*da/.20);
   const ridgeB=.040*f.faster*Math.exp(-db*db/.20);
   const r=f.bulk+ridgeA+ridgeB+.0012*Math.sin(2*Math.PI*(u*23-f.flow*23));
   positions[k]=p.x-v.y*r*c;
   positions[k+1]=p.y+v.x*r*c;
   positions[k+2]=.045+r*.78*s;
  }
 }
 geometry.attributes.position.needsUpdate=true;geometry.computeVertexNormals();
 const n=geometry.attributes.normal.array;
 function join(a,b){for(let k=0;k<3;k++){const m=(n[a*3+k]+n[b*3+k])*.5;n[a*3+k]=m;n[b*3+k]=m;}}
 for(let j=0;j<=M;j++)join(j,N*(M+1)+j);
 for(let i=0;i<=N;i++)join(i*(M+1),i*(M+1)+M);
 geometry.attributes.normal.needsUpdate=true;
 renderer.render(scene,camera);
}
let running=!matchMedia('(prefers-reduced-motion: reduce)').matches,t=0,last=0,speed=1;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
reduced.addEventListener('change',()=>{running=!reduced.matches;});
new ResizeObserver(()=>{renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);frame(t);}).observe(canvas);
window.mercuryFrame=(seconds)=>{running=false;renderer.setAnimationLoop(null);t=seconds;frame(t);};
renderer.setAnimationLoop(now=>{if(last&&running&&!document.hidden)t+=Math.min((now-last)/1000,.05)*speed;last=now;frame(t);});
}catch(e){console.error('Mercury renderer:',e);}
</script></body></html>
